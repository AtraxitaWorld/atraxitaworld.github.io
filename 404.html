<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — העמוד לא נמצא | אטרקציה</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0507">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="./assets/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100dvh;background:#050506;overflow-x:hidden}
body{display:flex;align-items:center;justify-content:center;padding:32px 18px;font-family:Saira,Rubik,'Helvetica Neue',Helvetica,sans-serif;color:#f1f1f4;text-align:center}
a{color:#ffd9dc;text-decoration:none}
a:hover{color:#ffffff}
@media (hover:hover) and (pointer:fine){html,body,*{cursor:url("./assets/icons/atraxita-cursor.png") 16 16,auto}a,button{cursor:url("./assets/icons/atraxita-cursor.png") 16 16,pointer}}
@keyframes bg{0%,100%{transform:scale(1.02) translate3d(0,0,0)}50%{transform:scale(1.05) translate3d(0,-1%,0)}}
@keyframes halo{0%,100%{opacity:.55}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div aria-hidden="true" style="position:fixed;inset:-3%;z-index:0;pointer-events:none;">
  <div style="position:absolute;inset:0;background-image:url('./assets/images/bg-loop-poster.jpg');background-size:cover;background-position:center 42%;animation:bg 26s ease-in-out infinite;"></div>
  <div style="position:absolute;inset:0;background:#000;opacity:.62;"></div>
  <div style="position:absolute;left:50%;top:44%;width:min(760px,92vw);height:min(560px,70vh);transform:translate(-50%,-50%);background:radial-gradient(ellipse 50% 44% at 50% 40%,rgba(196,26,40,.3),rgba(150,14,26,.1) 46%,transparent 72%);filter:blur(8px);animation:halo 7s ease-in-out infinite;"></div>
  <div style="position:absolute;inset:0;box-shadow:inset 0 0 220px 60px rgba(0,0,0,.8);"></div>
</div>

<main style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;width:100%;">
  <img src="./assets/images/atraxita-logo-clean.png" alt="הלוגו של אטרקציה" width="512" height="512" style="display:block;width:min(132px,34vw);height:auto;filter:drop-shadow(0 10px 26px rgba(0,0,0,.6));">
  <p style="margin:0;font-family:'Chakra Petch',Saira,sans-serif;font-weight:700;font-size:clamp(3.4rem,16vw,5.5rem);line-height:1;letter-spacing:.12em;margin-inline-end:-.12em;color:#ffffff;text-shadow:0 0 34px rgba(226,44,58,.5);">404</p>
  <h1 style="margin:0;font-family:'Chakra Petch',Saira,sans-serif;font-weight:600;font-size:clamp(1.05rem,4.6vw,1.35rem);letter-spacing:.1em;margin-inline-end:-.1em;color:#f1f1f4;">העמוד לא נמצא</h1>
  <p style="margin:0;font-size:.9375rem;line-height:1.6;color:rgba(240,240,246,.74);text-wrap:pretty;">ייתכן שהקישור שגוי או שהעמוד הוסר. אפשר לחזור לעמוד הראשי ולמצוא שם את כל הקישורים הרשמיים.</p>
  <a id="home" href="./" style="display:inline-flex;align-items:center;gap:9px;min-height:46px;margin-top:6px;padding:12px 26px;border-radius:999px;border:1px solid rgba(226,44,58,.65);background:linear-gradient(180deg,rgba(164,18,30,.92),rgba(96,8,16,.92));box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);font-family:Saira,sans-serif;font-weight:600;font-size:.875rem;letter-spacing:.1em;margin-inline-end:-.1em;color:#ffffff;">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" style="flex:none;"><path d="M12 3.2 3 10.6V21h6.2v-6h5.6v6H21V10.6z" fill="currentColor"></path></svg>
    חזרה לעמוד הראשי
  </a>
</main>

<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var base = '/';
  if (/\.github\.io$/i.test(location.hostname) && parts.length > 0 && parts[0].indexOf('.') < 0) base = '/' + parts[0] + '/';
  document.getElementById('home').setAttribute('href', location.origin + base);
})();
</script>
</body>
</html>
